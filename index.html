<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Sushi Maré</title>
  <!-- carregar com defer (safe) -->
  <script src="menu.js" defer></script>
  <style>
    body{font-family:Arial,Helvetica,sans-serif;margin:0;padding:1rem}
    .cardapio{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}
    .prato{border:1px solid #ddd;padding:0.5rem;border-radius:6px}
    .prato img{width:100%;height:140px;object-fit:cover;border-radius:4px}
    .preco{font-weight:700;margin-top:0.5rem}
  </style>
</head>
<body>
  <main>
    <h1>Sushi Maré — Cardápio</h1>
    <!-- local onde o script adicionará os cards -->
    <section id="lista-pratos" class="cardapio"></section>
  </main>

  <footer>
    <p>© <span id="ano"></span> Sushi Maré</p>
  </footer>
</body>
</html>
